<p>Выставка – музей – собираются различные экспонаты, предметы культуры, техники, истории отечества, региона. Например, «Уфа и уфимцы», «Ф. Шаляпин. Уфимские адреса», «Уфимская мода ХХ века», «Этот город, который мы любим». (ФОТО д/б № 17)</p>
