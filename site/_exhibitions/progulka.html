---
title: "Выставка - прогулка"
letter: "П"
order: 189
---
<p>Выставка – прогулка – своеобразная виртуальная прогулка по каким-либо местам: «Исторический сквер», «Стань туристом в собственном городе». На выставке «По лесным тропинкам» размещаются вопросы, которые из леса на хвосте принесла сорока.</p>
