---
title: "Выставка фигурная"
letter: "Ф"
order: 249
---
<p>Выставка фигурная – оформляется в нетрадиционной форме. Например, «К нам новая книга пришла» - в форме дорожки. Необычное пространственное расположение книг привлекает к себе внимание и дает возможность представить книги в разных ракурсах.</p>
