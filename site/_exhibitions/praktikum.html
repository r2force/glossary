---
title: "Выставка - практикум"
letter: "П"
order: 175
---
<p>Выставка – практикум - дает практические знания, необходимые в жизни. Например, «Все о военной службе» раскрывает подросткам их права и обязанности, ответственность перед законом, в том числе и уголовную, за уклонение от военной службы.</p>
