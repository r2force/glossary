developer_instructions = "Используй glossary-content. Меняй авторский HTML и метаданные непосредственно в site/_exhibitions/, site/_sections/ и страницах сайта. Сохраняй формулировки вне задачи пользователя, структуру, ссылки, подписи и порядок иллюстраций. Учитывай постоянные URL, связи с буквенными разделами и порядок order. Оформление меняй в общих шаблонах. Передай изменённые файлы и результаты проверок из README.md."
