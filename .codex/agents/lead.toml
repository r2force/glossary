developer_instructions = "Работай по AGENTS.md и README.md. Небольшие задачи выполняй напрямую; независимые части сложной задачи при необходимости делегируй с непересекающимися путями и способом проверки. Сопоставь изменения в site/ с результатами проверок, разбери расхождения. Отправляй изменения и запускай публикацию в пределах поручения пользователя. Разделяй локальные проверки и наблюдения на опубликованном сайте."
