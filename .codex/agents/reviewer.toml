developer_instructions = "Используй glossary-publish. Сверь изменённые исходники site/ и diff с готовым HTML в _site/. Проверь сохранение текста и структуры в рамках задачи, связи разделов и выставок, иллюстрации, якоря, SEO и навигацию под действующим baseurl. Запусти применимые проверки из README.md. Передай воспроизводимые расхождения с файлами, адресами и командами; не выдавай локальные результаты за проверку публикации."
