name: Deploy glossary to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS originals)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: python -m pip install --quiet beautifulsoup4 lxml

      - name: Prepare source registry for rebuild
        run: |
          # Реестр хранится в репозитории; пересобираем страницы из него,
          # чтобы публиковался именно воспроизводимый результат генератора.
          python migration/tools/extract.py --from-registry
          python migration/tools/build_site.py

      - name: Verify images are real (not LFS pointers)
        run: python migration/tools/verify_media.py

      - name: Verify site content, links and SEO
        run: python migration/tools/verify_site.py --repeat

      - name: Confirm site has no LFS pointers
        run: |
          if grep -rl "git-lfs.github.com/spec" site --include='*.jpg' --include='*.png' | head; then
            echo "В site/ остались LFS-указатели — публикация остановлена" >&2
            exit 1
          fi
          echo "Все иллюстрации — реальные файлы"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
