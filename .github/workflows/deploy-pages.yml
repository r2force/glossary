name: Deploy glossary to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS originals)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: python -m pip install --quiet beautifulsoup4 lxml

      - name: Prepare source registry for rebuild
        run: |
          # Реестр хранится в репозитории; пересобираем страницы из него,
          # чтобы публиковался именно воспроизводимый результат генератора.
          python migration/tools/extract.py --from-registry
          python migration/tools/build_site.py

      - name: Verify images are real (not LFS pointers)
        run: python migration/tools/verify_media.py

      - name: Verify site content, links and SEO
        run: python migration/tools/verify_site.py --repeat

      - name: Confirm site has no LFS pointers
        run: |
          python - <<'PY'
          import os, sys
          bad = []
          for dirpath, _, names in os.walk("site"):
              for name in names:
                  if not name.lower().endswith((".jpg", ".jpeg", ".png", ".gif")):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, "rb") as fh:
                      if fh.read(40).startswith(b"version https://git-lfs"):
                          bad.append(path)
          if bad:
              print("В site/ остались LFS-указатели:", *bad[:5], sep="\n  ")
              sys.exit(1)
          print("Все иллюстрации в site/ — реальные файлы")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check published site over HTTPS
        run: |
          python3 - <<'PY'
          import re, sys, time, urllib.request, urllib.error

          BASE = "https://r2force.github.io/glossary"
          IMAGE = "/images/stories/exhibition/horovod/horovod1.jpg"
          THUMB = "/images/stories/exhibition/horovod/thumbs/60x60/horovod1.jpg"

          checks = [
              ("/", 200, "Книга"),
              ("/introduction/index.html", 200, "ВВЕДЕНИЕ"),
              ("/contents/index.html", 200, "Алфавитный указатель"),
              ("/conclusion/index.html", 200, "Заключение"),
              ("/sections/a/index.html", 200, "Раздел"),
              ("/sections/p/index.html", 200, "Раздел"),
              ("/sections/ya/index.html", 200, "Раздел"),
              ("/exhibitions/akrostih/index.html", 200, "акростих"),
              ("/exhibitions/horovod/index.html", 200, "хоровод"),
              ("/exhibitions/yarmarka-literaturnaya/index.html", 200, "ярмарка"),
              ("/assets/site.css", 200, "--accent"),
          ]

          def get(path, attempts=6):
              last = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(
                          BASE + path, headers={"User-Agent": "glossary-smoke/1.0"})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return response.status, response.read()
                  except urllib.error.HTTPError as exc:
                      return exc.code, exc.read()
                  except Exception as exc:  # сеть/таймаут — повторяем
                      last = exc
                      time.sleep(10)
              raise SystemExit(f"{path}: недоступен: {last!r}")

          failures = []
          for path, status, needle in checks:
              try:
                  got, body = get(path)
              except SystemExit as exc:
                  failures.append(str(exc))
                  continue
              text = body.decode("utf-8", "replace")
              flag = "ok " if got == status and needle in text else "FAIL"
              print(f"{flag} {got} {path}")
              if got != status or needle not in text:
                  failures.append(f"{path}: {got}, маркер найден: {needle in text}")

          for path in (IMAGE, THUMB):
              got, body = get(path)
              is_jpeg = body[:2] == b"\xff\xd8"
              print(f"{'ok ' if got == 200 and is_jpeg else 'FAIL'} {got} {path} "
                    f"({len(body)} байт, jpeg={is_jpeg})")
              if got != 200 or not is_jpeg or len(body) < 2000:
                  failures.append(f"{path}: изображение не отдано как JPEG")

          got, body = get("/this-page-does-not-exist-12345/")
          text = body.decode("utf-8", "replace")
          not_found = got == 404 and "Страница не найдена" in text
          print(f"{'ok ' if not_found else 'FAIL'} {got} неизвестный адрес")
          if not not_found:
              failures.append(f"404: получен {got}")

          if failures:
              print("НЕУДАЧИ:", *failures, sep="\n  ")
              sys.exit(1)
          print("Все проверки опубликованного сайта пройдены")
          PY
