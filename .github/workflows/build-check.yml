name: Check glossary

on:
  push:
    branches-ignore: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.python-version'
      - '.ruby-version'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: site
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test, build and verify
        run: PYTHON=python scripts/check.sh
