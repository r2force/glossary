name: Build check (glossary)

# Проверка сборки на ветке разработки: те же шаги, что и в deploy-pages.yml,
# но без публикации. Нужна, чтобы убедиться, что сайт собирается и проходит
# проверки на runner с реальными файлами Git LFS.
on:
  push:
    branches:
      - arena/47e5cade-glossary
    paths:
      - 'site/**'
      - 'migration/tools/**'
      - '.github/workflows/build-check.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS originals)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: python -m pip install --quiet beautifulsoup4 lxml

      - name: Rebuild site from the registry
        run: |
          python migration/tools/extract.py --from-registry
          python migration/tools/build_site.py

      - name: Verify images are real (not LFS pointers)
        run: python migration/tools/verify_media.py

      - name: Verify site content, links and SEO
        run: python migration/tools/verify_site.py --repeat

      - name: Confirm site has no LFS pointers
        run: |
          if grep -rl "git-lfs.github.com/spec" site --include='*.jpg' --include='*.png' | head; then
            echo "В site/ остались LFS-указатели — публикация остановлена" >&2
            exit 1
          fi
          echo "Все иллюстрации — реальные файлы"
