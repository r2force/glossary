name: Fetch original images (migration, one-shot)

# Проверка и получение оригиналов иллюстраций из Git LFS силами GitHub Actions.
# Локальная песочница не имеет доступа к github-cloud.githubusercontent.com,
# поэтому реальные байты изображений проверяются и сохраняются здесь.
on:
  push:
    branches:
      - arena/47e5cade-glossary
    paths:
      - '.github/workflows/fetch-lfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          ref: arena/47e5cade-glossary
          lfs: true

      - name: Verify real image bytes
        run: python3 migration/tools/verify_media.py

      - name: Store originals outside LFS for publishing
        run: |
          mkdir -p migration/media
          python3 - <<'PY'
          import hashlib, json, os, shutil
          root = "site/images"
          report = []
          for dirpath, _, files in os.walk(root):
              for name in sorted(files):
                  if not name.lower().endswith((".jpg", ".jpeg", ".png", ".gif")):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, "rb") as fh:
                      data = fh.read()
                  rel = os.path.relpath(path, "site")
                  target = os.path.join("migration/media", rel)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  shutil.copyfile(path, target)
                  report.append({
                      "path": rel,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
          with open("migration/media/files.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=1)
          print("скопировано файлов:", len(report))
          PY
          du -sh migration/media

      - name: Commit originals
        run: |
          git config user.name "glossary-media"
          git config user.email "glossary-media@users.noreply.github.com"
          git add -A migration/media
          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "Получить оригиналы иллюстраций из Git LFS [skip ci]"
          git push origin HEAD:arena/47e5cade-glossary
