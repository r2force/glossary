name: Harvest source (migration, one-shot)

# Одноразовый сборщик исходного сайта glossary.ufacsdb.ru.
# Запускается только при изменении самого этого файла, чтобы не зациклиться
# на коммитах с собранными данными.
on:
  push:
    branches:
      - arena/47e5cade-glossary
    paths:
      - '.github/workflows/harvest-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-source
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/47e5cade-glossary

      - name: Install parser
        run: python3 -m pip install --quiet beautifulsoup4 requests

      - name: Probe source site
        run: |
          python3 - <<'PY'
          import requests
          r = requests.get("https://glossary.ufacsdb.ru/", timeout=30,
                           headers={"User-Agent": "glossary-migration/1.0"})
          print("status", r.status_code, "bytes", len(r.content))
          r.encoding = r.apparent_encoding or "utf-8"
          print(r.text[:400])
          PY

      - name: Crawl glossary.ufacsdb.ru
        run: python3 migration/tools/harvest.py

      - name: Commit harvested data
        run: |
          git config user.name "glossary-harvest"
          git config user.email "glossary-harvest@users.noreply.github.com"
          git add migration/source
          if git diff --cached --quiet; then
            echo "Нет изменений в собранных данных"
            exit 0
          fi
          git commit -m "Собрать исходные страницы glossary.ufacsdb.ru [skip ci]"
          git push origin HEAD:arena/47e5cade-glossary
